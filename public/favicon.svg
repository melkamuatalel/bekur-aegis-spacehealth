<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldGrad" x1="40" y1="20" x2="460" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091834" />
      <stop offset="50%" stop-color="#040c1a" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="40" y1="20" x2="460" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="500" height="500" rx="32" fill="url(#spaceGlow)" />

  <!-- Outer Aegis Shield (Polygon) -->
  <polygon
    points="250,30 440,120 440,340 250,470 60,340 60,120"
    fill="url(#shieldGrad)"
    stroke="url(#shieldBorder)"
    stroke-width="8"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inset Telemetry Shield -->
  <polygon
    points="250,60 410,135 410,325 250,440 90,325 90,135"
    fill="none"
    stroke="#00f0ff"
    stroke-width="2.5"
    stroke-dasharray="12 8"
    opacity="0.5"
  />

  <!-- Interlocking Orbital Gyro Rings -->
  <ellipse cx="250" cy="250" rx="170" ry="60" transform="rotate(-25 250 250)" stroke="#00f0ff" stroke-width="4" stroke-dasharray="24 12" opacity="0.8" filter="url(#neonGlow)" />
  <ellipse cx="250" cy="250" rx="170" ry="60" transform="rotate(35 250 250)" stroke="#f59e0b" stroke-width="4" stroke-dasharray="20 10" opacity="0.7" />

  <!-- Central Caduceus / Vital Lead-II Waveform -->
  <path
    d="M 110,250 L 190,250 L 210,210 L 230,310 L 250,150 L 270,340 L 290,220 L 310,250 L 390,250"
    stroke="#00f0ff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#neonGlow)"
  />

  <!-- Central Pulsing Plasma Core -->
  <circle cx="250" cy="250" r="14" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="250" cy="250" r="24" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.6" />

  <!-- 4 Deep Space Astronaut Nodes -->
  <circle cx="250" cy="95" r="7" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle cx="395" cy="225" r="7" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="250" cy="405" r="7" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="105" cy="225" r="7" fill="#00f0ff" filter="url(#neonGlow)" />

  <!-- Ge'ez Typography Monogram: በኩር -->
  <text x="250" y="385" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    በኩር • BEKUR
  </text>
  <text x="250" y="415" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="6">
    AEGIS // NASA 2026
  </text>
</svg>
